name: 🚀 Feature Request
description: Propose a new capability, model support, or enhancement for Relent AI.
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an idea! Please explain the problem you are trying to solve and how the proposed feature fits into Relent AI.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Motivation
      description: Is your feature request related to a problem or limitation?
      placeholder: I am always frustrated when...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution & User Experience
      description: Describe the solution or new feature you would like to see.
      placeholder: Relent AI could support...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.

  - type: checkboxes
    id: willing_to_contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a Pull Request to implement this feature.
