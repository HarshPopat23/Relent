name: 🐛 Bug Report
description: Report a defect, error, or unexpected behavior in Relent AI.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us reproduce and resolve the bug.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Run `python main.py --source "..."`
        2. Set language to 'hinglish'
        3. See error traceback
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs & Traceback
      description: Paste any error messages, terminal output, or stack traces.
      render: shell

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - Linux (Ubuntu/Debian)
        - Linux (Arch/Fedora/Other)
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Docker
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Python version, Ollama version, GPU model (if applicable).
      placeholder: "Python 3.11, Ollama 0.3.0, NVIDIA RTX 4070"
    validations:
      required: true
